name: Docker Build and Push

on:
  push:
    branches:
    - main
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract tag version
      if: startsWith(github.ref, 'refs/tags/')
      id: extract_tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Configure AWS credentials
      if: startsWith(github.ref, 'refs/tags/')
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon ECR
      if: startsWith(github.ref, 'refs/tags/')
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Cache Image
      uses: docker/build-push-action@v6
      with:
        push: ${{ startsWith(github.ref, 'refs/tags/') }}
        tags: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/tkf:{1}', steps.login-ecr.outputs.registry, env.TAG) || 'tkf:main' }}
        cache-from: |
          type=gha,scope=${{ github.ref_name }}-tkf
          type=gha,scope=main-tkf
        cache-to: type=gha,mode=min,scope=${{ github.ref_name }}-tkf
